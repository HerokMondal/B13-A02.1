<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWave</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="styles/techwave.css">

<body class="inter-font">
    <header class="navbar display-flex">
        <h2 class="brand text-p">Tech<span class="g-color">Wave</span></h2>
            <ul class="nav-links display-flex">
                <li class="nav-item"><a href="" class="nav-link text-p">About</a></li>
                <li class="nav-item"><a href="" class="nav-link text-p">Episodes</a></li>
                <li class="nav-item"><a href="" class="nav-link text-p">Host</a></li>
            </ul>
            <button class="btn">Subscribe<i class="fa-solid fa-arrow-right"></i></button>
            <!-- Mobile Menu -->
             <div class="menu-icon">
                <i class="fa-solid fa-bars"></i>
             </div>
             
            
    </header>
    <main>
        <!-- banner -->
        <section class="banner display-flex">
            <div class="banner-image">
                <img src="assets/hero-circle.png" class="main-image"  alt="">
                <img src="assets/microphone.png" class="top-image"  alt="">

                <span class="new-badge">NEW</span>
            </div>
            <div class="banner-content">
                <h2>TechWave</h2>
                <p>Your daily dose of tech insights, productivity hacks, and personal growth</p>
                
                <button class="Spotify  btn"><i class="fa-brands fa-spotify"></i>Listen on Spotify</button>

        </section>

        <!-- About Section -->
         
    </main>
